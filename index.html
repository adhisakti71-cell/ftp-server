 return `<h2 class="noprint">Sertifikat</h2>${sel}<div class="cert"><div class="ct" style="left:50.59%;top:46.68%; font-size:${Math.min(4.1,41/(0.56*Math.max(String(u.nama).length,1)))}cqw">${esc(u.nama)}</div><div class="ct" style="left:50.13%;top:59.18%; font-size:${Math.min(3,30/(0.62*Math.max(String(mapel).length,1)))}cqw">${esc(mapel.toUpperCase())}</div><div class="ct" style="left:55.01%;top:71.88%; font-size:4.7cqw;color:#fff">${x.nilai} / 100</div><div class="ct" style="left:50.46%;top:79.79%; font-size:2.2cqw">STATUS: ${lulus?'TUNTAS':'BELUM TUNTAS'}</div><div class="cl" style="left:73.31%;top:78.42%; font-size:1.35cqw">Klaten, ${tanggal}</div><div class="cl" style="left:73.31%;top:80.96%; font-size:1.35cqw">Guru Mata Pelajaran</div><div class="ct" style="left:81.77%;top:91.02%; font-size:1.6cqw">${esc(guruNama||'Dina Nurfitasari')}</div></div><p class="noprint" style="text-align:center;margin-top:14px"><button class="btn" onclick="print()">🖨 Cetak / Simpan PDF</button><span class="mut" style="margin-left:12px">Atur orientasi → Landscape di dialog cetak</span></p>`}
function getCfg(){return G('cfg')||{guru:'Dina Nurfitasari',mapel:'FTP Server',kelas:'',sekolah:''}}
function saveCfg(){const c=getCfg();c.guru=$('cg').value;c.mapel=$('cm').value;c.kelas=$('ck').value;c.sekolah=$('cs').value;S('cfg',c);$('cfgok').textContent='✓ Tersimpan';setTimeout(()=>$('cfgok').textContent='',2000)}
function akun(){const c=getCfg();const cfgCard=me.role==='guru'?`<div class="card"><b>Pengaturan Sertifikat</b><label>Nama Guru (muncul di sertifikat)</label><input id="cg" value="${esc(c.guru)}"><label>Nama Mata Pelajaran</label><input id="cm" value="${esc(c.mapel)}"><label>Kelas</label><input id="ck" value="${esc(c.kelas)}"><label>Nama Sekolah</label><input id="cs" value="${esc(c.sekolah)}"><button class="btn" onclick="saveCfg()">Simpan</button> <span id="cfgok" class="mut"></span></div>`:'';return `<h2>Keamanan Akun</h2><div class="card"><p class="mut">Login: <b>${esc(me.username)}</b></p><label>Password baru</label><input id="np" type="password"><button class="btn" onclick="chPw()">Simpan Password</button><p id="pm" class="mut"></p></div>${cfgCard}`}
function chPw(){const v=$('np').value;if(v.length<3){$('pm').textContent='Minimal 3 karakter';return}const u=G('users');u.find(x=>x.id===me.id).password=v;S('users',u);$('pm').textContent='Password diganti ✔'}
const PD=[['Pekan 1','Flashdisk bergantian',45],['Pekan 2','Kirim lewat chat grup',30],['Pekan 3','FTP Server (awal belajar)',14],['Pekan 4','FTP Server',9],['Pekan 5','FTP Server',8]];
const PQ=[
{q:'Sebutkan tiga komponen yang tampak pada gambar dan port yang dipakai untuk koneksi kontrol FTP.',a:'Komputer siswa (FTP Client), jaringan LAN (switch), dan FTP Server. Port kontrol FTP adalah 21.',p:'Informasi ini langsung terlihat pada gambar (label 1-3) dan cerita (port 21 di firewall). Jawaban cukup menyebut ulang informasi.'},
{q:'Mengapa waktu pengumpulan tugas turun dari pekan 1 ke pekan 5? Hubungkan gambar, cerita, dan data dengan fungsi FTP Server.',a:'Contoh: file dikirim ke satu server pusat lewat LAN sehingga siswa tidak antre memakai flashdisk, akun dan folder pribadi mencegah file tertukar, dan siswa makin terbiasa memakai FTP Client.',p:'Jawaban lain diterima jika memuat alasan dan bukti dari data (45 menit menjadi 8 menit) serta fungsi FTP (transfer terpusat, hak akses).'},
{q:'Hitunglah penghematan waktu pekan 5 dibanding pekan 1 (dalam menit dan persen). Berapa waktu rata-rata per siswa di pekan 5?',a:'Penghematan = 45 - 8 = 37 menit. Persen = 37 : 45 x 100% = sekitar 82%. Rata-rata per siswa pekan 5 = 8 : 32 = 0,25 menit (15 detik).',p:'Langkah: cari selisih, bagi dengan waktu awal, lalu kalikan 100%. Waktu per siswa = total waktu : jumlah siswa.'},
{q:'Kelas lain berisi 36 siswa dan waktu tersisa hanya 10 menit. Apakah FTP Server cukup? Putuskan berdasarkan data dan hitunganmu.',a:'Dengan 0,25 menit per siswa, 36 siswa butuh 36 x 0,25 = 9 menit, jadi cukup tetapi hanya tersisa 1 menit; akun dan folder sebaiknya disiapkan lebih dulu. Dengan cara flashdisk pekan 1 (45 : 32 = sekitar 1,41 menit per siswa), 36 siswa butuh sekitar 51 menit sehingga tidak cukup.',p:'Keputusan boleh berbeda (misalnya tetap menyiapkan cadangan) selama memakai angka 9 menit dan batas 10 menit sebagai bukti.'}];
const STORY='Di SMK Nusa Cendekia (nama fiktif), Pak Rudi mengajar Administrasi Infrastruktur Jaringan di kelas XI yang berisi 32 siswa. Setiap selesai praktik, siswa mengumpulkan laporan dan file konfigurasi. Awalnya mereka bergantian memakai flashdisk, sehingga pengumpulan memakan 45 menit dan beberapa file rusak. Pak Rudi lalu meminta siswa memasang FileZilla Server di komputer lab. Siswa membuat akun, menentukan folder tujuan, dan mengatur hak akses agar setiap siswa hanya bisa mengunggah ke folder miliknya. Beberapa siswa sempat gagal terhubung karena lupa membuka port 21 di firewall; mereka mencari penyebabnya sendiri, saling bertanya, dan mencatat langkah perbaikannya. Dalam lima pekan, mereka terbiasa memakai FTP Client dan pengumpulan hanya butuh 8 menit. Selain lebih cepat, guru dapat memeriksa semua file di satu tempat dan tidak ada tugas yang hilang.';
function pjg(n){pj=n;render();scrollTo(0,0)}
function pjb(i){if(!(pa[i]||'').trim()){pb[i]=-1}else pb[i]=1;render()}
function pojok(){const T=['Amati','Baca','Pahami Data','Jawab','Refleksi'];let b='';
 if(pj===0)b=`<div class="card"><h3 style="margin-top:0">1. Amati Gambarnya</h3>
 <svg viewBox="0 0 640 250" style="width:100%;height:auto" role="img" aria-label="Diagram komputer siswa terhubung ke FTP Server lewat jaringan LAN">
 <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8z" style="fill:var(--pri)"/></marker></defs>
 <style>.b{fill:var(--soft);stroke:var(--pri);stroke-width:2}.t{fill:var(--tx);font:600 14px system-ui}.s{fill:var(--mut);font:12px system-ui}.n{fill:var(--pri)}.nt{fill:#fff;font:700 13px system-ui}</style>
 <rect class="b" x="15" y="85" width="150" height="80" rx="10"/><text class="t" x="90" y="120" text-anchor="middle">Komputer Siswa</text><text class="s" x="90" y="140" text-anchor="middle">(FTP Client)</text>
 <rect class="b" x="245" y="100" width="150" height="50" rx="10"/><text class="t" x="320" y="130" text-anchor="middle">Jaringan LAN</text>
 <rect class="b" x="470" y="30" width="155" height="190" rx="10"/><text class="t" x="547" y="55" text-anchor="middle">FTP Server</text>
 <text class="s" x="547" y="85" text-anchor="middle">Folder: siswa01</text><text class="s" x="547" y="105" text-anchor="middle">Folder: siswa02</text><text class="s" x="547" y="125" text-anchor="middle">Folder: ...</text><text class="s" x="547" y="145" text-anchor="middle">Folder: siswa32</text><text class="s" x="547" y="195" text-anchor="middle">Login + hak akses</text>
 <line x1="165" y1="125" x2="243" y2="125" stroke-width="3" style="stroke:var(--pri)" marker-end="url(#ar)"/><line x1="395" y1="125" x2="468" y2="125" stroke-width="3" style="stroke:var(--pri)" marker-end="url(#ar)"/>
 <text class="s" x="430" y="112" text-anchor="middle">Port 21</text>
 <circle class="n" cx="90" cy="70" r="13"/><text class="nt" x="90" y="75" text-anchor="middle">1</text><circle class="n" cx="320" cy="85" r="13"/><text class="nt" x="320" y="90" text-anchor="middle">2</text><circle class="n" cx="547" cy="14" r="13"/><text class="nt" x="547" y="19" text-anchor="middle">3</text></svg>
 <p><b>Gambar 1.</b> Alur pengumpulan tugas lewat FTP di lab jaringan. Penanda: 1 = perangkat siswa, 2 = jalur jaringan, 3 = server penyimpan file.</p>
 <p class="mut">Ilustrasi diagram, bukan foto kejadian sebenarnya.</p>
 <div class="card" style="background:var(--soft);border:0"><b>Pertanyaan pengamatan</b><ol><li>Apa yang kamu lihat pada gambar?</li><li>Bagaimana hubungan gambar ini dengan materi yang kita pelajari?</li></ol></div></div>`;
 if(pj===1)b=`<div class="card"><h3 style="margin-top:0">2. Baca Kisahnya: Dari Flashdisk ke FTP Server</h3><div class="rd">${esc(STORY)}</div><p class="mut">Kisah ini adalah skenario fiktif untuk pembelajaran (tokoh, sekolah, dan angka tidak nyata).</p></div>
 <div class="card" style="background:var(--soft);border:0"><b>Hubungannya dengan Pelajaran Kita</b><ul><li><b>FTP Server</b> menyimpan file di satu tempat sehingga mudah diperiksa.</li><li><b>FTP Client</b> (misalnya FileZilla Client) terhubung dengan host, username, password, dan port 21.</li><li><b>Konfigurasi user dan hak akses</b> menjaga setiap siswa hanya mengunggah ke foldernya.</li><li><b>Firewall</b> perlu mengizinkan port FTP agar koneksi berhasil.</li></ul></div>
 <div class="card mut">Sumber konsep: <a href="https://www.rfc-editor.org/rfc/rfc959" target="_blank" rel="noopener">RFC 959 – File Transfer Protocol (IETF)</a>; <a href="https://www.iana.org/assignments/service-names-port-numbers/service-names-port-numbers.xhtml" target="_blank" rel="noopener">IANA – Service Name and Transport Protocol Port Number Registry</a>.</div>`;
 if(pj===2)b=`<div class="card"><h3 style="margin-top:0">3. Pahami Datanya</h3><b>Waktu mengumpulkan 32 tugas per pekan (menit)</b>
 <div class="sc"><table><tr><th>Pekan</th><th>Metode</th><th>Waktu (menit)</th></tr>${PD.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><b>${r[2]}</b></td></tr>`).join('')}</table></div>
 <p><b>Grafik batang</b> (skala 0–50 menit; angka tertulis di setiap batang)</p>
 ${PD.map(r=>`<div style="display:flex;align-items:center;gap:8px;margin:6px 0"><span style="width:60px;font-size:13px">${r[0]}</span><div class="bar" style="flex:1;height:20px"><i style="width:${r[2]/50*100}%;background:${r[2]>20?'#64748b':'var(--pri)'}"></i></div><b style="width:70px;font-size:13px">${r[2]} mnt</b></div>`).join('')}
 <p class="mut">Data simulasi untuk pembelajaran. Batang abu-abu = cara lama (di atas 20 menit), batang biru = FTP; label tetap tertulis pada setiap baris.</p></div>`;
 if(pj===3)b=`<div class="card"><h3 style="margin-top:0">4. Ayo Temukan Makna</h3><p class="mut">Tulis jawabanmu dulu (atau di buku/diskusi), baru buka pembahasan.</p></div>`+PQ.map((x,i)=>`<div class="card"><b>${['Temukan informasi','Simpulkan hubungan','Hitung dan bandingkan','Ambil keputusan'][i]}</b><p>${i+1}. ${esc(x.q)}</p><textarea rows="3" placeholder="Tulis jawabanmu..." oninput="pa[${i}]=this.value">${esc(pa[i]||'')}</textarea>
 <button class="btn s" onclick="pjb(${i})">Lihat Pembahasan</button>${pb[i]===-1?'<p class="mut">Coba jawab dulu ya, lalu buka pembahasan.</p>':''}${pb[i]===1?`<div class="card" style="background:var(--soft);border:0;margin-top:10px"><b>Contoh jawaban:</b> ${esc(x.a)}<br><br><b>Pembahasan:</b> ${esc(x.p)}</div>`:''}</div>`).join('');
 if(pj===4)b=`<div class="card"><h3 style="margin-top:0">5. Inspirasi untukku</h3><p><b>Setelah membaca, mengamati, dan memahami data, keterampilan apa yang ingin kamu kuasai?</b></p><textarea rows="3" placeholder="Tulis refleksimu..."></textarea>
 <div class="card" style="background:var(--soft);border:0"><b>Tantangan kecil</b><p>Rancang struktur folder FTP untuk satu kelas: tentukan nama folder, siapa yang boleh membaca, menulis, dan menghapus. Jelaskan alasannya, lalu diskusikan dengan temanmu.</p></div></div>`;
 return `<div class="hero"><h1>POJOK DIGITAL</h1><p>Lihat Dunianya, Baca Kisahnya, Pahami Datanya!</p></div>
 <div class="row" style="margin-bottom:12px;justify-content:flex-start">${T.map((t,i)=>`<span class="tag ${i===pj?'ok':''}" style="${i===pj?'font-weight:700':''}">${i+1}. ${t}</span>`).join('')}</div>${b}
 <div class="row"><button class="btn o" ${pj?'':'disabled'} onclick="pjg(${pj-1})">‹ Kembali</button><button class="btn o" onclick="go('dash')">Menu Utama</button><button class="btn" ${pj<4?'':'disabled'} onclick="pjg(${pj+1})">Lanjut ›</button></div>`}
function dmurid(){if(me.role!=='guru')return '';const us=G('users').filter(u=>u.role==='murid').sort((x,y)=>x.nama.localeCompare(y.nama)),h=G('hasil'),pr=G('progress'),n=G('materi').length;
 return `<h2>Data Murid</h2><div class="card"><b>Tambah Murid</b><div class="grid" style="margin:8px 0 0"><div><input id="mn" placeholder="Nama lengkap"></div><div><input id="mu" placeholder="Username"></div><div><input id="mp" placeholder="Password" value="123"></div></div><button class="btn" onclick="addM()">+ Tambah</button> <button class="btn o" onclick="expM()">⬇ Ekspor Excel</button><p id="mm" class="mut"></p></div>
 <div class="card sc"><table><tr><th>No</th><th>Nama</th><th>Username</th><th>Materi</th><th>Pengerjaan</th><th>Nilai Terakhir</th><th></th></tr>${us.map((u,i)=>{const hh=h.filter(x=>x.user_id===u.id);return `<tr><td>${i+1}</td><td>${esc(u.nama)}</td><td>${esc(u.username)}</td><td>${pr.filter(p=>p.user_id===u.id).length}/${n}</td><td>${hh.length}</td><td><b>${hh.length?hh[hh.length-1].nilai:'-'}</b></td><td><button class="btn o s" onclick="rpw(${u.id})">Reset PW</button> <button class="btn r s" onclick="delM(${u.id})">Hapus</button></td></tr>`}).join('')||'<tr><td>Belum ada murid</td></tr>'}</table></div>`}
function addM(){const n=$('mn').value.trim(),u=$('mu').value.trim(),p=$('mp').value||'123',us=G('users');
 if(!n||!u){$('mm').textContent='Nama dan username wajib diisi';return}
 if(us.some(x=>x.username===u)){$('mm').textContent='Username sudah dipakai';return}
 us.push({id:us.reduce((a,b)=>Math.max(a,b.id),0)+1,nama:n,role:'murid',username:u,password:p});S('users',us);render()}
function delM(id){S('users',G('users').filter(u=>u.id!==id));S('hasil',G('hasil').filter(x=>x.user_id!==id));S('progress',G('progress').filter(x=>x.user_id!==id));render()}
function rpw(id){const us=G('users');us.find(u=>u.id===id).password='123';S('users',us);alert('Password direset ke 123')}
function expM(){const h=G('hasil'),pr=G('progress'),rows=G('users').filter(u=>u.role==='murid').map(u=>{const hh=h.filter(x=>x.user_id===u.id);return{Nama:u.nama,Username:u.username,'Materi Selesai':pr.filter(p=>p.user_id===u.id).length,Pengerjaan:hh.length,'Nilai Terakhir':hh.length?hh[hh.length-1].nilai:''}});
 const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(rows),'Murid');XLSX.writeFile(wb,'data-murid.xlsx')}
function db(){const T={users:'id, nama, role, username, password',materi:'id, judul, deskripsi, isi',soal:'id, pertanyaan, a, b, c, d, e, kunci, sumber',hasil:'id, user_id, nilai, benar, total, tanggal',progress:'user_id, materi_id'};
 return `<h2>Database (Tabel)</h2>`+Object.keys(T).map(t=>`<div class="card"><div class="row"><b>${t}</b><span class="tag">${G(t).length} baris</span></div><p class="mut">${T[t]}</p></div>`).join('')}
</script></body></html>
